<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="js" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">

    <title>Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }



        /* ===========================
   ADMIN PANEL
=========================== */

        #adminPanel {

            max-width: 1200px;

            margin: auto;

        }

        /* ===========================
   HEADER
=========================== */

        .admin-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }

        .admin-header h1 {

            color: #2563eb;

            font-size: 34px;

        }

        #logoutBtn {

            background: #ef4444;

            color: white;

            border: none;

            padding: 12px 24px;

            border-radius: 10px;

            cursor: pointer;

            transition: .3s;

        }

        #logoutBtn:hover {

            background: #dc2626;

        }

        /* ===========================
   DASHBOARD
=========================== */

        .dashboard {

            display: grid;

            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));

            gap: 20px;

            margin-bottom: 35px;

        }

        .dashboard-card {

            background: white;

            padding: 25px;

            border-radius: 18px;

            text-align: center;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);

        }

        .dashboard-card h2 {

            font-size: 40px;

            color: #2563eb;

        }

        .dashboard-card p {

            margin-top: 10px;

            color: #666;

            font-weight: 600;

        }

        /* ===========================
   FORM
=========================== */

        .form-section {

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);

            margin-bottom: 35px;

        }

        .form-section h2 {

            margin-bottom: 25px;

            color: #2563eb;

        }

        .form-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;

        }

        .form-grid input,
        .form-grid select {

            width: 100%;

            padding: 14px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

        }

        #previewContainer {

            margin: 25px 0;

            text-align: center;

        }

        #previewContainer img {

            max-width: 250px;

            border-radius: 12px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, .15);

        }

        #uploadForm button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #16a34a;

            color: white;

            font-size: 17px;

            cursor: pointer;

            transition: .3s;

        }

        #uploadForm button:hover {

            background: #15803d;

        }

        /* ===========================
   PAPERS
=========================== */

        .papers-section {

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);

        }

        .papers-section h2 {

            color: #2563eb;

            margin-bottom: 20px;

        }

        .paper-card {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 18px;

            border: 1px solid #eee;

            border-radius: 12px;

            margin-bottom: 15px;

            transition: .3s;

        }

        .paper-card:hover {

            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, .08);

        }

        .paper-info strong {

            font-size: 17px;

        }

        .paper-info small {

            color: #777;

        }

        .paper-actions {

            display: flex;

            gap: 10px;

        }

        .paper-actions button {

            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            color: white;

            transition: .3s;

        }

        .edit-btn {

            background: #2563eb;

        }

        .edit-btn:hover {

            background: #1d4ed8;

        }

        .delete-btn {

            background: #ef4444;

        }

        .delete-btn:hover {

            background: #dc2626;

        }

        #adminSearch {

            width: 100%;

            padding: 14px;

            margin: 20px 0;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

        }

        /* ===========================
   MOBILE
=========================== */

        @media(max-width:768px) {

            body {

                padding: 15px;

            }

            .admin-header {

                flex-direction: column;

                gap: 20px;

            }

            .form-grid {

                grid-template-columns: 1fr;

            }

            .paper-card {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }

            .paper-actions {

                width: 100%;

            }

            .paper-actions button {

                flex: 1;

            }

        }
    </style>
</head>

<body>
    <!-- ===========================
         ADMIN PANEL
    ============================ -->

    <div id="adminPanel">

        <!-- HEADER -->

        <header class="admin-header">

            <h1 style="font-family: serif;"> Exam_Solutions(pyq) Admin
            </h1>

            <button id="logoutBtn">
                🚪 Logout
            </button>

        </header>



        <!-- DASHBOARD -->

        <div class="dashboard-card">

            <h2 id=" adminTotalPapers">0

            </h2>

            <p>Total Papers</p>

        </div>

        <div class="dashboard-card">

            <h2 id="adminTotalCourses">0</h2>

            <p>Total Courses</p>

        </div>
    </div>




    <!-- UPLOAD FORM -->

    <section class="form-section">

        <h2 style="font-family: serif; align-items: center; text-align: center;"> Upload Question Paper</h2>

        <th:block th:if="${session.succMsg}">
            <p class="text-success text-center  fw-bold">[[${session.succMsg}]] </p>
        </th:block>
        <th:block th:if="${session.errorMsg}">
            <p class="text-danger text-center  fw-bold">[[${session.errorMsg}]] </p>
        </th:block>
        <th:block th:text="${@removalImpl.removeSessionMessage()}"></th:block>
        <form th:action="@{/admin/saved}" method="post" enctype="multipart/form-data">

            <div class="form-grid">

                <select name="course" required>
                    <option value="">Select Course</option>
                    <option>BCA</option>
                    <option>BBA</option>
                    <option>BA</option>
                    <option>B.Com</option>
                    <option>B.Sc</option>
                    <option>B.Ed</option>
                    <option>LLB</option>
                    <option>MBA</option>
                    <option>MCA</option>
                    <option>M.Sc</option>
                </select>


                <select name="semester" required>

                    <option value="">Select Semester</option>

                    <option value="1">Semester 1</option>
                    <option value="2">Semester 2</option>
                    <option value="3">Semester 3</option>
                    <option value="4">Semester 4</option>
                    <option value="5">Semester 5</option>
                    <option value="6">Semester 6</option>
                    <option value="7">Semester 7</option>
                    <option value="8">Semester 8</option>

                </select>



                <input type="text" name="subject" placeholder="Subject Name" required>



                <input type="text" name="paperCode" placeholder="Paper Code" required>



                <select name="examType" required>

                    <option value="">Select Exam Type</option>

                    <option>Mid Semester</option>

                    <option>End Semester</option>

                    <option>Sessional</option>

                    <option>Regular</option>
                    <option>Practical</option>

                    <option>Back Paper</option>

                </select>



                <input type="text" name="year" placeholder="Year" required>



                <input type="text" name="session" placeholder="Session (2025-26)" required>



                <input type="file" name="image" required>

            </div>



            <div id="previewContainer">

                <!-- show image itract db -->
            </div>

            <button type="submit"
                style="width: 100%; height: 30px; gap: 10; font-family: serif; font-size: 20px; background-color: #15803d; color: white; text-align: center; justify-content: center;">

                Upload Paper

            </button>

        </form>

    </section>



    <!-- PAPER LIST -->

    <section class="papers-section">

        <h2 style="font-family: serif; align-items: center; text-align: center;">Uploaded Papers</h2>
        <input type="text" name="adminSearch" placeholder="🔍 Search by Subject, Course or Paper Code...">

    </section>

    </div>

    <!-- card -->



    <div class="container">
        <div class="row " th:each="e:${examData}">

            <!-- Card 1 -->

            <div class="col col-md-3">
                <div class="card shadow-sm h-100 rounded-4 ">
                    <div class="card-body">

                        <span class="badge bg-primary mb-3"> [[${e.examType}]] </span>

                        <h5 class="fw-bold">[[${e.subject}]]</h5>


                        <div class="row mb-3">
                            <div class="col-6">
                                <strong>[[${e.paperCode}]] </strong> <br>
                                <small>Year</small><br>
                                <small>Semester</small><br>
                                <small>Session</small>
                            </div>

                            <div class="col-6">
                                <strong> [[${e.course}]] </strong><br>
                                <strong> [[${e.year}]] </strong><br>
                                <strong> [[${e.semester}]] </strong><br>
                                <strong> [[${e.session}]] </strong>
                            </div>

                        </div>

                        <div class="justify-content-between text-align-center">
                            <button class="btn btn-primary">Edit</button>
                            <button class="btn btn-success">Delete</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    <script src="admin.js"></script>


</body>

</html>
